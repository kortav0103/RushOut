name: rush_out
description: "RushOut - A 2D top-down Parking Jam / Rush Hour sliding block puzzle game in Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  sqflite: ^2.3.3+1
  path: ^1.9.0
  dio: ^5.7.0
  flutter_dotenv: ^5.1.0
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5
  device_info_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env.example
    - assets/levels/rush1000.txt
    - assets/images/vehicles/
    - assets/audio/
    - assets/audio/sfx/
